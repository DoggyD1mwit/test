<script>

/* ===== YOUR ORIGINAL JS (UNCHANGED) ===== */


/* ========================= */
/* ✅ ADDITIONS START HERE */
/* ========================= */

let ctxData = null;
const menuEl = document.getElementById("customMenu");

/* ADD BUTTONS SAFELY */
if (!menuEl.querySelector("[data-action='open']")) {
    const openBtn = document.createElement("button");
    openBtn.textContent = "OPEN";
    openBtn.dataset.action = "open";

    const infoBtn = document.createElement("button");
    infoBtn.textContent = "INFO";
    infoBtn.dataset.action = "info";

    menuEl.appendChild(openBtn);
    menuEl.appendChild(infoBtn);
}

/* INFO PANEL */
function openInfo(name, url) {
    const panel = document.getElementById("infoPanel");
    panel.innerHTML = `<h3>${name}</h3><p>${url}</p>`;
    panel.classList.add("open");
}

/* RIGHT CLICK HANDLER */
document.addEventListener("contextmenu", (e) => {
    const btn = e.target.closest("#frogieList button, #gamesList button, #bookmarkList button");
    if (!btn) return;

    e.preventDefault();

    let name = btn.textContent;
    let url = btn.dataset.url;

    // fallback
    if (!url && btn.onclick) {
        const match = btn.onclick.toString().match(/openP\(['"](.+?)['"]\)/);
        if (match) url = match[1];
    }

    ctxData = { name, url };

    // bookmark index detection (KEEP REMOVE WORKING)
    const bmBtns = [...document.querySelectorAll("#bookmarkList button")];
    currentBmIdx = bmBtns.indexOf(btn);

    menuEl.style.display = "block";
    menuEl.style.left = e.pageX + "px";
    menuEl.style.top = e.pageY + "px";
});

/* MENU ACTIONS */
menuEl.addEventListener("click", (e) => {
    const action = e.target.dataset.action;
    if (!action || !ctxData) return;

    if (action === "open") openP(ctxData.url);
    if (action === "info") openInfo(ctxData.name, ctxData.url);

    menuEl.style.display = "none";
});

/* CLOSE UI */
document.addEventListener("click", () => {
    menuEl.style.display = "none";
    document.getElementById("infoPanel").classList.remove("open");
});

/* AUTO ATTACH URL DATA */
function attachDataUrls() {
    document.querySelectorAll("#frogieList button").forEach((btn, i) => {
        if (frogieLinks[i]) btn.dataset.url = frogieLinks[i].url;
    });

    document.querySelectorAll("#gamesList button").forEach((btn, i) => {
        if (games[i]) btn.dataset.url = games[i].url;
    });

    document.querySelectorAll("#bookmarkList button").forEach((btn, i) => {
        if (bookmarks[i]) btn.dataset.url = bookmarks[i].url;
    });
}

/* HOOK NAV (SAFE OVERRIDE) */
const oldNav = nav;
nav = function(id) {
    oldNav(id);
    setTimeout(attachDataUrls, 1100);
};

/* ========================= */
/* ✅ ADDITIONS END */
/* ========================= */

</script>
